<!-- Formal Resume 1 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formal Resume</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            padding: 20px;
            border: 1px solid #ddd;
            width: 50%;
            margin: auto;
        }
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            display: block;
            margin: auto;
        }
        h1, h2 {
            text-align: center;
        }
    </style>
</head>
<body>
    <img src="profile.jpg" alt="Profile Photo" class="profile-img">
    <h1>John Doe</h1>
    <h2>Location: New York, USA</h2>
    
    <h3>Student Academic Details</h3>
    <p><strong>University:</strong> XYZ University</p>
    <p><strong>Degree:</strong> Bachelor of Computer Applications</p>
    <p><strong>Year:</strong> 2023 - 2026</p>
    
    <h3>Skills</h3>
    <ul>
        <li>HTML, CSS, JavaScript</li>
        <li>Python, Java</li>
        <li>Database Management</li>
        <li>Flutter Development</li>
    </ul>
</body>
</html>
